<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Nova AI</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --bg:#080b14;
  --panel:#101522;
  --panel2:#171d2d;
  --text:#f5f7ff;
  --muted:#9ca6bd;
  --border:#283148;
  --accent:#6c7cff;
  --user:#27345f;
  --nova:#151b2a;
  --danger:#ff5964;
}

body.light{
  --bg:#f4f6fb;
  --panel:#ffffff;
  --panel2:#eef1f7;
  --text:#101522;
  --muted:#657087;
  --border:#d9deea;
  --accent:#5865f2;
  --user:#dce3ff;
  --nova:#ffffff;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  height:100vh;
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

#app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */
header{
  height:62px;
  background:var(--panel);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 14px;
  flex-shrink:0;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:bold;
}

.logoIcon{
  width:38px;
  height:38px;
  border-radius:12px;
  background:linear-gradient(135deg,#6c7cff,#9b6cff);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
}

.headerBtns{
  display:flex;
  gap:7px;
}

.iconBtn{
  width:40px;
  height:40px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:11px;
}

/* CHAT */
#chat{
  flex:1;
  overflow-y:auto;
  padding:18px 12px 120px;
}

.welcome{
  max-width:700px;
  margin:50px auto;
  text-align:center;
}

.welcome h1{
  font-size:34px;
  margin-bottom:10px;
}

.welcome p{
  color:var(--muted);
  line-height:1.6;
}

.message{
  max-width:850px;
  margin:0 auto 14px;
  display:flex;
  gap:9px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  background:var(--panel2);
  border:1px solid var(--border);
}

.bubble{
  max-width:calc(100% - 45px);
  padding:12px 14px;
  border-radius:15px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.user .bubble{
  background:var(--user);
}

.nova .bubble{
  background:var(--nova);
  border:1px solid var(--border);
}

/* ATTACHMENT */
.attachment{
  max-width:850px;
  margin:0 auto 14px;
  padding:10px;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:12px;
  display:none;
}

.attachment img{
  max-width:180px;
  max-height:180px;
  border-radius:9px;
  display:block;
  margin-top:7px;
}

.attachmentName{
  color:var(--muted);
  font-size:13px;
}

/* COMPOSER */
.composerArea{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  background:linear-gradient(transparent,var(--bg) 25%);
  padding:18px 12px 12px;
}

.composer{
  max-width:850px;
  margin:auto;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  padding:8px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}

#input{
  width:100%;
  min-height:46px;
  max-height:130px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:var(--text);
  padding:9px 10px;
}

.toolbar{
  display:flex;
  align-items:center;
  gap:7px;
}

.toolBtn{
  height:38px;
  min-width:38px;
  padding:0 10px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
}

.sendBtn{
  margin-left:auto;
  background:var(--accent);
  color:white;
  border:0;
  width:42px;
  height:38px;
  border-radius:10px;
  font-size:18px;
}

/* PANEL */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  z-index:20;
}

.sidePanel{
  position:absolute;
  right:0;
  top:0;
  bottom:0;
  width:min(350px,90vw);
  background:var(--panel);
  padding:18px;
  overflow-y:auto;
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.panelHeader h2{
  font-size:20px;
}

.closeBtn{
  width:38px;
  height:38px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
}

.setting{
  padding:14px 0;
  border-bottom:1px solid var(--border);
}

.setting label{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.setting small{
  display:block;
  color:var(--muted);
  margin-top:5px;
}

.action{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  border-radius:10px;
  text-align:left;
}

.danger{
  color:var(--danger);
}

/* LOADING */
.typing{
  display:flex;
  gap:4px;
}

.typing span{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--muted);
  animation:bounce 1s infinite;
}

.typing span:nth-child(2){
  animation-delay:.15s;
}

.typing span:nth-child(3){
  animation-delay:.3s;
}

@keyframes bounce{
  50%{transform:translateY(-5px);opacity:.5}
}

@media(max-width:600px){
  .welcome{
    margin:35px auto;
  }

  .welcome h1{
    font-size:28px;
  }

  .bubble{
    max-width:calc(100% - 40px);
  }

  .toolBtn{
    padding:0 8px;
  }
}
</style>
</head>

<body>

<div id="app">

<header>
  <div class="logo">
    <div class="logoIcon">✦</div>
    <span>Nova AI</span>
  </div>

  <div class="headerBtns">
    <button class="iconBtn" id="newChatBtn" title="New Chat">＋</button>
    <button class="iconBtn" id="historyBtn" title="History">🕘</button>
    <button class="iconBtn" id="settingsBtn" title="Settings">⚙️</button>
  </div>
</header>

<main id="chat">

  <div class="welcome" id="welcome">
    <h1>How can I help?</h1>
    <p>
      I'm Nova AI. Ask me anything and I'll try my best to help.
    </p>
  </div>

</main>

<div id="attachment" class="attachment">
  <div id="attachmentName" class="attachmentName"></div>
  <img id="previewImage" alt="Preview">
</div>

<div class="composerArea">
  <div class="composer">

    <textarea
      id="input"
      placeholder="Message Nova AI..."
      rows="1"
    ></textarea>

    <div class="toolbar">

      <button class="toolBtn" id="fileBtn" title="Attach file">
        📎
      </button>

      <button class="toolBtn" id="imageBtn" title="Add image">
        🖼️
      </button>

      <button class="toolBtn" id="voiceBtn" title="Voice input">
        🎤
      </button>

      <button class="toolBtn" id="searchBtn" title="Search web">
        🔎
      </button>

      <button class="toolBtn" id="speakBtn" title="Speak last answer">
        🔊
      </button>

      <button class="sendBtn" id="sendBtn" title="Send">
        ➤
      </button>

    </div>
  </div>
</div>

<input type="file" id="fileInput" hidden>
<input type="file" id="imageInput" accept="image/*" hidden>

</div>

<!-- SETTINGS -->
<div class="overlay" id="settingsOverlay">

  <div class="sidePanel">

    <div class="panelHeader">
      <h2>Nova Settings</h2>
      <button class="closeBtn" id="closeSettings">×</button>
    </div>

    <div class="setting">
      <label>
        <span>Dark Mode</span>
        <input type="checkbox" id="darkMode" checked>
      </label>
      <small>Change Nova's appearance.</small>
    </div>

    <div class="setting">
      <label>
        <span>Auto Speak</span>
        <input type="checkbox" id="autoSpeak">
      </label>
      <small>Automatically speak Nova's replies.</small>
    </div>

    <button class="action" id="exportBtn">
      📤 Export Conversation
    </button>

    <button class="action" id="memoryBtn">
      🧠 View Memory
    </button>

    <button class="action" id="testBtn">
      🔌 Test Nova Connection
    </button>

    <button class="action danger" id="clearBtn">
      🗑️ Clear All Data
    </button>

  </div>

</div>

<!-- HISTORY -->
<div class="overlay" id="historyOverlay">

  <div class="sidePanel">

    <div class="panelHeader">
      <h2>Chat History</h2>
      <button class="closeBtn" id="closeHistory">×</button>
    </div>

    <div id="historyList"></div>

  </div>

</div>

<script>

/* =========================
   NOVA BACKEND
========================= */

const NOVA_BACKEND =
"https://red-mountain-f307.motiharijan123456.workers.dev/chat";


/* =========================
   STATE
========================= */

let messages = [];
let lastNovaReply = "";
let selectedFile = null;

let settings = JSON.parse(
  localStorage.getItem("novaSettings") || "{}"
);

let savedChats = JSON.parse(
  localStorage.getItem("novaChats") || "[]"
);

let memory = JSON.parse(
  localStorage.getItem("novaMemory") || "[]"
);


/* =========================
   ELEMENTS
========================= */

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

const fileInput = document.getElementById("fileInput");
const imageInput = document.getElementById("imageInput");

const attachment = document.getElementById("attachment");
const attachmentName = document.getElementById("attachmentName");
const previewImage = document.getElementById("previewImage");

const settingsOverlay =
document.getElementById("settingsOverlay");

const historyOverlay =
document.getElementById("historyOverlay");


/* =========================
   SETTINGS LOAD
========================= */

const darkMode =
document.getElementById("darkMode");

const autoSpeak =
document.getElementById("autoSpeak");

if(settings.darkMode === false){
  darkMode.checked = false;
  document.body.classList.add("light");
}

if(settings.autoSpeak === true){
  autoSpeak.checked = true;
}


/* =========================
   SAVE SETTINGS
========================= */

function saveSettings(){

  settings.darkMode = darkMode.checked;
  settings.autoSpeak = autoSpeak.checked;

  localStorage.setItem(
    "novaSettings",
    JSON.stringify(settings)
  );
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(role,text){

  const welcome =
  document.getElementById("welcome");

  if(welcome){
    welcome.remove();
  }

  const row =
  document.createElement("div");

  row.className =
  "message " +
  (role === "user" ? "user" : "nova");

  const avatar =
  document.createElement("div");

  avatar.className = "avatar";

  avatar.textContent =
  role === "user" ? "👤" : "✦";

  const bubble =
  document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  row.appendChild(avatar);
  row.appendChild(bubble);

  chat.appendChild(row);

  chat.scrollTop =
  chat.scrollHeight;
}


/* =========================
   TYPING
========================= */

function showTyping(){

  const row =
  document.createElement("div");

  row.className =
  "message nova";

  row.id = "typingMessage";

  const avatar =
  document.createElement("div");

  avatar.className = "avatar";
  avatar.textContent = "✦";

  const bubble =
  document.createElement("div");

  bubble.className = "bubble";

  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;

  row.appendChild(avatar);
  row.appendChild(bubble);

  chat.appendChild(row);

  chat.scrollTop =
  chat.scrollHeight;
}


function hideTyping(){

  const el =
  document.getElementById("typingMessage");

  if(el){
    el.remove();
  }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const text =
  input.value.trim();

  if(!text && !selectedFile){
    return;
  }

  let finalText = text;

  if(selectedFile){

    finalText +=
    (finalText ? "\n\n" : "") +
    "[Attached file: " +
    selectedFile.name +
    "]";

  }

  addMessage("user",finalText);

  messages.push({
    role:"user",
    content:finalText
  });

  input.value = "";
  input.style.height = "auto";

  const currentHistory =
  messages.slice(-20);

  selectedFile = null;

  attachment.style.display = "none";

  showTyping();

  try{

    const response =
    await fetch(NOVA_BACKEND,{
      method:"POST",

      headers:{
        "Content-Type":"application/json"
      },

      body:JSON.stringify({
        message:finalText,
        history:currentHistory
      })
    });

    if(!response.ok){
      throw new Error(
        "Server error: " + response.status
      );
    }

    const data =
    await response.json();

    hideTyping();

    if(!data.ok){

      throw new Error(
        data.error || "Nova returned an error"
      );

    }

    const reply =
    data.reply || "I couldn't generate a reply.";

    lastNovaReply = reply;

    messages.push({
      role:"assistant",
      content:reply
    });

    addMessage("assistant",reply);

    saveCurrentChat();

    if(settings.autoSpeak){
      speakText(reply);
    }

  }catch(error){

    hideTyping();

    const errorText =
    "Sorry, Nova connection error.\n\n" +
    error.message;

    addMessage("assistant",errorText);

  }

}


/* =========================
   SAVE CHAT
========================= */

function saveCurrentChat(){

  if(messages.length === 0){
    return;
  }

  savedChats =
  savedChats.filter(
    chatItem =>
    JSON.stringify(chatItem.messages)
    !== JSON.stringify(messages)
  );

  savedChats.unshift({
    id:Date.now(),
    title:
    messages.find(
      m => m.role === "user"
    )?.content?.slice(0,40)
    || "Nova Chat",

    messages:[...messages],

    date:new Date().toLocaleString()
  });

  savedChats =
  savedChats.slice(0,30);

  localStorage.setItem(
    "novaChats",
    JSON.stringify(savedChats)
  );
}


/* =========================
   NEW CHAT
========================= */

function newChat(){

  if(messages.length){
    saveCurrentChat();
  }

  messages = [];

  lastNovaReply = "";

  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>How can I help?</h1>
      <p>
        I'm Nova AI. Ask me anything and I'll try my best to help.
      </p>
    </div>
  `;

  input.focus();
}


/* =========================
   LOAD CHAT
========================= */

function loadChat(id){

  const selected =
  savedChats.find(
    item => item.id === id
  );

  if(!selected){
    return;
  }

  messages =
  [...selected.messages];

  chat.innerHTML = "";

  messages.forEach(message => {

    addMessage(
      message.role === "user"
      ? "user"
      : "assistant",
      message.content
    );

  });

  historyOverlay.style.display =
  "none";

}


/* =========================
   HISTORY
========================= */

function showHistory(){

  const list =
  document.getElementById("historyList");

  list.innerHTML = "";

  if(savedChats.length === 0){

    list.innerHTML =
    "<p style='color:var(--muted)'>No saved chats yet.</p>";

  }else{

    savedChats.forEach(item => {

      const btn =
      document.createElement("button");

      btn.className = "action";

      btn.textContent =
      "💬 " + item.title;

      btn.onclick =
      () => loadChat(item.id);

      list.appendChild(btn);

    });

  }

  historyOverlay.style.display =
  "block";
}


/* =========================
   VOICE INPUT
========================= */

function startVoice(){

  const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice input is not supported by this browser."
    );

    return;
  }

  const recognition =
  new SpeechRecognition();

  recognition.lang = "en-IN";
  recognition.interimResults = false;

  recognition.onstart = () => {
    document.getElementById("voiceBtn").textContent =
    "🔴";
  };

  recognition.onresult = event => {

    const spoken =
    event.results[0][0].transcript;

    input.value +=
    (input.value ? " " : "") +
    spoken;

  };

  recognition.onerror = event => {

    alert(
      "Voice error: " +
      event.error
    );

  };

  recognition.onend = () => {

    document.getElementById("voiceBtn").textContent =
    "🎤";

  };

  recognition.start();

}


/* =========================
   SPEAK
========================= */

function speakText(text){

  if(!("speechSynthesis" in window)){

    alert(
      "Text-to-speech is not supported."
    );

    return;
  }

  speechSynthesis.cancel();

  const utterance =
  new SpeechSynthesisUtterance(text);

  utterance.lang = "en-IN";
  utterance.rate = 1;
  utterance.pitch = 1;

  speechSynthesis.speak(
    utterance
  );

}


/* =========================
   FILE
========================= */

fileInput.onchange = () => {

  const file =
  fileInput.files[0];

  if(!file){
    return;
  }

  selectedFile = file;

  attachment.style.display =
  "block";

  attachmentName.textContent =
  "📎 " + file.name;

  previewImage.style.display =
  "none";

};


/* =========================
   IMAGE
========================= */

imageInput.onchange = () => {

  const file =
  imageInput.files[0];

  if(!file){
    return;
  }

  selectedFile = file;

  attachment.style.display =
  "block";

  attachmentName.textContent =
  "🖼️ " + file.name;

  previewImage.style.display =
  "block";

  const reader =
  new FileReader();

  reader.onload = event => {

    previewImage.src =
    event.target.result;

  };

  reader.readAsDataURL(file);

};


/* =========================
   SEARCH
========================= */

function webSearch(){

  const query =
  input.value.trim();

  if(!query){

    alert(
      "Pehle search text likho."
    );

    input.focus();

    return;
  }

  window.open(
    "https://www.google.com/search?q=" +
    encodeURIComponent(query),
    "_blank"
  );

}


/* =========================
   EXPORT
========================= */

function exportConversation(){

  if(messages.length === 0){

    alert(
      "Conversation empty hai."
    );

    return;
  }

  let text =
  "NOVA AI CONVERSATION\n";
  
  text +=
  "====================\n\n";

  messages.forEach(message => {

    text +=
    (message.role === "user"
      ? "YOU"
      : "NOVA") +
    ":\n";

    text +=
    message.content +
    "\n\n";

  });

  const blob =
  new Blob(
    [text],
    {type:"text/plain"}
  );

  const url =
  URL.createObjectURL(blob);

  const a =
  document.createElement("a");

  a.href = url;
  a.download =
  "nova-conversation.txt";

  a.click();

  URL.revokeObjectURL(url);

}


/* =========================
   MEMORY
========================= */

function showMemory(){

  if(memory.length === 0){

    alert(
      "Nova Memory empty hai."
    );

    return;
  }

  alert(
    "Nova Memory:\n\n" +
    memory.join("\n")
  );

}


/* =========================
   CONNECTION TEST
========================= */

async function testConnection(){

  try{

    const response =
    await fetch(
      NOVA_BACKEND,
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json"
        },

        body:JSON.stringify({
          message:
          "Hello Nova, connection test",
          history:[]
        })
      }
    );

    const data =
    await response.json();

    alert(
      data.ok
      ? "✅ Nova Connected!\n\n" +
        data.reply
      : "❌ Nova Error\n\n" +
        JSON.stringify(data)
    );

  }catch(error){

    alert(
      "❌ Connection Failed\n\n" +
      error.message
    );

  }

}


/* =========================
   CLEAR DATA
========================= */

function clearData(){

  const ok =
  confirm(
    "Kya aap Nova ka saved history aur settings clear karna chahte ho?"
  );

  if(!ok){
    return;
  }

  localStorage.removeItem(
    "novaChats"
  );

  localStorage.removeItem(
    "novaSettings"
  );

  localStorage.removeItem(
    "novaMemory"
  );

  savedChats = [];
  memory = [];

  alert(
    "✅ Nova data clear ho gaya."
  );

}


/* =========================
   BUTTONS
========================= */

sendBtn.onclick =
sendMessage;

document.getElementById(
  "newChatBtn"
).onclick =
newChat;

document.getElementById(
  "historyBt
