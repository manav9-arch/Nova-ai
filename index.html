<script>
const NOVA_BACKEND =
  "https://red-mountain-f307.motiharijan123456.workers.dev/chat";

async function testNovaConnection() {
  try {
    const response = await fetch(NOVA_BACKEND, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: "Hello Nova, connection test",
        history: []
      })
    });

    const data = await response.json();

    console.log("NOVA CONNECTION TEST:", data);

    alert(
      data.ok
        ? "✅ Nova Connected!\n\n" + data.reply
        : "❌ Nova Error:\n\n" + JSON.stringify(data)
    );

  } catch (error) {
    console.error("NOVA CONNECTION ERROR:", error);

    alert(
      "❌ Nova Connection Failed\n\n" +
      error.message
    );
  }
}

testNovaConnection();
