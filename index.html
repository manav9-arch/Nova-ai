<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b18">
<meta name="description" content="Nova AI - Advanced Personal AI Assistant">
<title>Nova AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#080b18;
  color:#fff;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  height:100vh;
  overflow:hidden
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:inherit}

.app{height:100vh;display:flex}

.sidebar{
  width:270px;
  background:#0d1222;
  border-right:1px solid #252d45;
  display:flex;
  flex-direction:column;
  padding:16px;
  gap:12px
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:800;
  padding:8px
}

.logoIcon{
  width:42px;
  height:42px;
  border-radius:14px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#8b5cf6,#22d3ee);
  box-shadow:0 0 30px #7c3aed66
}

.newChat{
  border:0;
  padding:12px;
  border-radius:12px;
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  font-weight:700
}

.menu{
  display:grid;
  gap:6px
}

.menu button,.bottom button{
  background:#11182b;
  border:1px solid #252d45;
  padding:11px;
  border-radius:11px;
  text-align:left
}

.menu button:hover,.bottom button:hover{
  background:#19223a
}

.history{
  flex:1;
  overflow:auto
}

.historyTitle{
  color:#8995b0;
  font-size:12px;
  margin:8px 4px
}

.history button{
  display:block;
  width:100%;
  background:transparent;
  border:0;
  padding:9px;
  color:#aab4ca;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  border-radius:8px
}

.bottom{
  display:grid;
  gap:6px
}

.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% -20%,#1c2750,transparent 45%),
    #080b18
}

.header{
  height:62px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #252d45;
  background:#090d1acc;
  backdrop-filter:blur(12px)
}

.header button{
  width:40px;
  height:40px;
  border-radius:11px;
  background:#10172a;
  border:1px solid #252d45
}

.status{
  color:#9aa6c0;
  font-size:13px
}

.statusDot{
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
  margin-right:6px
}

.content{
  flex:1;
  overflow:auto;
  padding:25px 15px 145px
}

.welcome{
  max-width:850px;
  margin:8vh auto 0;
  text-align:center
}

.novaOrb{
  width:105px;
  height:105px;
  margin:auto;
  display:grid;
  place-items:center;
  border-radius:32px;
  font-size:40px;
  font-weight:900;
  background:
    radial-gradient(circle at 30% 25%,#fff,#a78bfa 18%,#7c3aed 48%,#0891b2);
  box-shadow:0 0 80px #7c3aed77
}

.welcome h1{
  font-size:clamp(34px,7vw,58px);
  margin-top:22px
}

.welcome p{
  max-width:650px;
  margin:10px auto;
  color:#9aa6c0;
  line-height:1.6
}

.quick{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:24px
}

.quick button{
  padding:9px 14px;
  border-radius:999px;
  background:#11182b;
  border:1px solid #252d45
}

.messages{
  max-width:900px;
  margin:auto;
  display:grid;
  gap:15px
}

.message{
  display:flex;
  gap:9px;
  align-items:flex-start
}

.message.user{
  justify-content:flex-end
}

.avatar{
  width:35px;
  height:35px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#151e35;
  flex-shrink:0
}

.bubble{
  max-width:min(78%,720px);
  padding:13px 15px;
  border-radius:17px;
  background:#10172a;
  border:1px solid #252d45;
  line-height:1.55;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.user .bubble{
  background:#26365f;
  border-color:#40588d
}

.composerWrap{
  position:fixed;
  left:270px;
  right:0;
  bottom:0;
  padding:12px 15px 16px;
  background:linear-gradient(transparent,#080b18 32%)
}

.composer{
  max-width:900px;
  margin:auto;
  background:#0d1222;
  border:1px solid #29324c;
  border-radius:20px;
  padding:8px;
  box-shadow:0 15px 50px #0008
}

.inputRow{
  display:flex;
  gap:7px;
  align-items:flex-end
}

textarea{
  flex:1;
  min-height:45px;
  max-height:150px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  padding:11px
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:14px;
  background:linear-gradient(135deg,#8b5cf6,#4f46e5);
  font-weight:900
}

.tools{
  display:flex;
  gap:5px;
  padding:3px
}

.tools button{
  border:0;
  background:transparent;
  color:#929db6;
  padding:7px 9px;
  border-radius:8px
}

.tools button:hover{
  background:#161f35;
  color:white
}

.drawer{
  position:fixed;
  top:0;
  right:0;
  height:100vh;
  width:min(390px,94vw);
  background:#0d1222;
  border-left:1px solid #29324c;
  padding:18px;
  overflow:auto;
  transform:translateX(105%);
  transition:.25s;
  z-index:20
}

.drawer.open{transform:translateX(0)}

.drawer h2{
  margin-bottom:15px
}

.close{
  float:right;
  width:38px;
  height:38px;
  background:#151d31;
  border:1px solid #29324c;
  border-radius:10px
}

.card{
  background:#11182b;
  border:1px solid #29324c;
  border-radius:14px;
  padding:14px;
  margin:10px 0
}

.card label{
  display:block;
  color:#929db6;
  font-size:12px;
  margin-bottom:7px
}

.card input,.card select{
  width:100%;
  padding:10px;
  border-radius:10px;
  background:#080b18;
  color:white;
  border:1px solid #29324c;
  outline:0
}

.primary{
  border:0;
  padding:10px 14px;
  border-radius:10px;
  background:linear-gradient(135deg,#8b5cf6,#4f46e5);
  font-weight:700
}

.overlay{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:15
}

.overlay.show{display:block}

.toast{
  position:fixed;
  left:50%;
  bottom:90px;
  transform:translateX(-50%);
  background:#151d31;
  border:1px solid #29324c;
  padding:10px 15px;
  border-radius:11px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50
}

.toast.show{opacity:1}

@media(max-width:750px){
  .sidebar{
    position:fixed;
    left:0;
    top:0;
    height:100vh;
    z-index:30;
    transform:translateX(-105%);
    transition:.25s
  }

  .sidebar.open{transform:translateX(0)}

  .composerWrap{left:0}

  .bubble{max-width:87%}
}
</style>
</head>

<body>

<div class="app">

<aside class="sidebar" id="sidebar">

  <div class="logo">
    <div class="logoIcon">N</div>
    <div>Nova AI</div>
  </div>

  <button class="newChat" onclick="newChat()">＋ New Chat</button>

  <div class="menu">
    <button onclick="showHome()">💬 Chat</button>
    <button onclick="openTools()">🧰 Tools & APIs</button>
    <button onclick="openSettings()">⚙️ Settings</button>
    <button onclick="showMemory()">🧠 Memory</button>
  </div>

  <div class="historyTitle">RECENT CHATS</div>
  <div class="history" id="history"></div>

  <div class="bottom">
    <button onclick="exportChat()">⬇ Export Chat</button>
    <button onclick="clearData()">🗑 Clear Local Data</button>
  </div>

</aside>


<main class="main">

<header class="header">

  <button onclick="toggleSidebar()">☰</button>

  <div class="status">
    <span class="statusDot"></span>
    <span id="status">Nova Ready</span>
  </div>

  <button onclick="openSettings()">⚙</button>

</header>


<section class="content" id="content">

<div class="welcome" id="welcome">

  <div class="novaOrb">N</div>

  <h1>Hello, I'm Nova.</h1>

  <p>
    Your advanced personal AI assistant.
    Chat, voice, memory, files, images, tools,
    automation and future AI APIs — all built
    into one future-ready interface.
  </p>

  <div class="quick">
    <button onclick="promptUse('What can you do?')">✨ What can you do?</button>
    <button onclick="promptUse('Help me plan my day')">📅 Plan my day</button>
    <button onclick="promptUse('Explain something to me')">💡 Explain</button>
  </div>

</div>

<div class="messages" id="messages"></div>

</section>

</main>

</div>


<div class="composerWrap">

<div class="composer">

<div class="inputRow">

<textarea
 id="input"
 placeholder="Message Nova..."
 rows="1"></textarea>

<button class="send" onclick="sendMessage()">➤</button>

</div>

<div class="tools">

<button onclick="chooseFile()">📎 File</button>

<button onclick="chooseImage()">🖼 Image</button>

<button onclick="startVoice()">🎙 Voice</button>

<button onclick="speakLast()">🔊 Speak</button>

</div>

<input type="file" id="file" hidden onchange="fileSelected(this)">
<input type="file" id="image" accept="image/*" hidden onchange="imageSelected(this)">

</div>

</div>


<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<aside class="drawer" id="drawer">

<button class="close" onclick="closeDrawer()">×</button>

<h2 id="drawerTitle">Settings</h2>

<div id="drawerBody"></div>

</aside>


<div class="toast" id="toast"></div>


<script>

/*
====================================================
                 NOVA AI
       SINGLE FILE FUTURE FOUNDATION
====================================================

FEATURE SYSTEM:

1. AI CHAT
2. MEMORY
3. CHAT HISTORY
4. VOICE INPUT
5. VOICE OUTPUT
6. FILES
7. IMAGES / VISION
8. WEB SEARCH HOOK
9. TOOLS / FUNCTIONS HOOK
10. AUTOMATION HOOK
11. REALTIME VOICE HOOK
12. PWA READY FOUNDATION
13. SECURE BACKEND CONNECTION

IMPORTANT:
NEVER PUT API KEYS IN THIS FILE.

API keys belong in Cloudflare Worker/backend.
====================================================
*/


const Nova = {

  version:"1.0.0",

  backend:
    localStorage.getItem("nova_backend") || "",

  mode:
    localStorage.getItem("nova_mode") || "demo",

  voice:
    localStorage.getItem("nova_voice") !== "false",

  chats:
    JSON.parse(localStorage.getItem("nova_chats") || "[]"),

  current:{
    id:Date.now(),
    title:"New Chat",
    messages:[]
  }

};


/* ---------- BASIC UI ---------- */

function $(id){
  return document.getElementById(id);
}

function toast(text){

  $("toast").textContent=text;

  $("toast").classList.add("show");

  setTimeout(()=>{
    $("toast").classList.remove("show");
  },2200);

}


function toggleSidebar(){

  $("sidebar").classList.toggle("open");

}


function closeDrawer(){

  $("drawer").classList.remove("open");
  $("overlay").classList.remove("show");

}


function openDrawer(title,html){

  $("drawerTitle").textContent=title;
  $("drawerBody").innerHTML=html;

  $("drawer").classList.add("open");
  $("overlay").classList.add("show");

}


/* ---------- CHAT ---------- */

function newChat(){

  if(Nova.current.messages.length){

    Nova.chats.unshift({
      ...Nova.current
    });

  }

  Nova.current={
    id:Date.now(),
    title:"New Chat",
    messages:[]
  };

  save();

  render();
  renderHistory();

}


function showHome(){

  closeDrawer();

}


function promptUse(text){

  $("input").value=text;
  $("input").focus();

}


function addMessage(role,text){

  Nova.current.messages.push({

    role:role,
    content:text,
    time:new Date().toISOString()

  });

  render();

}


function render(){

  const messages=$("messages");
  const welcome=$("welcome");

  if(!Nova.current.messages.length){

    welcome.style.display="block";
    messages.innerHTML="";

    return;

  }

  welcome.style.display="none";

  messages.innerHTML="";

  Nova.current.messages.forEach(m=>{

    const row=document.createElement("div");

    row.className="message "+m.role;

    const avatar=document.createElement("div");

    avatar.className="avatar";

    avatar.textContent=
      m.role==="user" ? "You" : "N";

    const bubble=document.createElement("div");

    bubble.className="bubble";

    bubble.textContent=m.content;

    if(m.role==="user"){

      row.appendChild(bubble);
      row.appendChild(avatar);

    }else{

      row.appendChild(avatar);
      row.appendChild(bubble);

    }

    messages.appendChild(row);

  });

  $("content").scrollTop=$("content").scrollHeight;

}


async function sendMessage(){

  const input=$("input");

  const text=input.value.trim();

  if(!text){

    return;

  }

  addMessage("user",text);

  input.value="";

  input.style.height="auto";

  $("status").textContent="Nova is thinking…";


  /*
  ============================================
  REAL AI BACKEND
  ============================================
  Set backend mode in Settings.

  Example:

  https://your-worker.workers.dev
  ============================================
  */

  if(Nova.mode==="backend" && Nova.backend){

    try{

      const history=
        Nova.current.messages
        .slice(0,-1)
        .map(m=>({

          role:m.role,
          content:m.content

        }));


      const response=await fetch(

        Nova.backend.replace(/\/$/,"")+"/chat",

        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:JSON.stringify({

            message:text,

            history:history

          })

        }

      );


      const data=await response.json();


      if(!response.ok || !data.ok){

        throw new Error(
          data.error || "AI request failed"
        );

      }


      const reply=
        data.reply ||
        "Nova did not return a response.";


      addMessage("assistant",reply);

      $("status").textContent="Nova Online";


      if(Nova.voice){

        speak(reply);

      }


    }catch(error){

      addMessage(
        "assistant",
        "Nova backend connection failed.\n\n"+
        error.message+
        "\n\nCheck Settings → Backend URL."
      );

      $("status").textContent=
        "Backend connection needed";

    }

  }

  else{

    /*
    DEMO MODE
    */

    await new Promise(
      resolve=>setTimeout(resolve,500)
    );

    addMessage(
      "assistant",
      demoReply(text)
    );

    $("status").textContent="Nova Ready";

  }


  save();

  renderHistory();

}


function demoReply(text){

  const t=text.toLowerCase();


  if(
    t.includes("what can you do") ||
    t.includes("abilities")
  ){

    return `I'm Nova. 👋

My interface is designed for:

🤖 AI conversation
🧠 Memory
🎙 Voice input
🔊 Voice replies
📎 Files and PDFs
🖼 Image understanding
🌐 Web/search tools
🛠 Function calling
⏰ Automation
📱 PWA/mobile installation
⚡ Future realtime AI

Connect the secure backend to activate real AI.`;

  }


  if(
    t.includes("hello") ||
    t.includes("hi")
  ){

    return "Hello! 👋 I'm Nova. Your future-ready AI assistant is ready.";

  }


  return "I'm Nova's demo mode. The complete assistant foundation is ready. Connect the secure backend to activate real AI.";

}


/* ---------- MEMORY ---------- */

function showMemory(){

  openDrawer(

    "Memory",

    `
    <div class="card">

      <b>🧠 Nova Memory</b>

      <p style="color:#929db6;margin-top:8px;font-size:13px;line-height:1.5">

      Conversation history is stored locally
      on this device.

      A secure long-term memory API can be
      connected later through the backend.

      </p>

    </div>

    <div class="card">

      <b>Current chat messages</b>

      <p style="color:#929db6;margin-top:7px">

      ${Nova.current.messages.length}

      </p>

    </div>
    `

  );

}


/* ---------- HISTORY ---------- */

function renderHistory(){

  const history=$("history");

  history.innerHTML="";

  Nova.chats
    .slice(0,20)
    .forEach(chat=>{

      const button=
        document.createElement("button");

      button.textContent=
        chat.title || "Chat";

      button.onclick=()=>{

        Nova.current={
          ...chat
        };

        render();

        closeDrawer();

        $("sidebar")
          .classList.remove("open");

      };

      history.appendChild(button);

    });

}


function save(){

  localStorage.setItem(
    "nova_chats",
    JSON.stringify(Nova.chats)
  );

  localStorage.setItem(
    "nova_backend",
    Nova.backend
  );

  localStorage.setItem(
    "nova_mode",
    Nova.mode
  );

  localStorage.setItem(
    "nova_voice",
    Nova.voice
  );

}


/* ---------- VOICE INPUT ---------- */

let recognition=null;


function startVoice(){

  const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SpeechRecognition){

    toast(
      "Voice input is not supported here."
    );

    return;

  }


  if(recognition){

    recognition.stop();

    recognition=null;

    toast("Voice stopped");

    return;

  }


  recognition=
    new SpeechRecognition();


  recognition.lang="en-IN";

  recognition.interimResults=false;


  recognition.onstart=()=>{

    toast("Listening…");

  };


  recognition.onresult=(event)=>{

    $("input").value=
      event.results[0][0].transcript;

  };


  recognition.onerror=()=>{

    toast("Voice input error");

  };


  recognition.onend=()=>{

    recognition=null;

  };


  recognition.start();

}


/* ---------- VOICE OUTPUT ---------- */

function speak(text){

  if(
    !window.speechSynthesis ||
    !text
  ){

    return;

  }


  speechSynthesis.cancel();


  const utterance=
    new SpeechSynthesisUtterance(text);


  utterance.lang="en-IN";

  utterance.rate=.98;

  speechSynthesis.speak(
    utterance
  );

}


function speakLast(){

  const messages=
    Nova.current.messages;


  const last=
    [...messages]
    .reverse()
    .find(m=>m.role==="assistant");


  if(!last){

    toast("No Nova reply yet.");

    return;

  }


  speak(last.content);

}


/* ---------- FILES ---------- */

function chooseFile(){

  $("file").click();

}


function fileSelected(input){

  if(!input.files.length){

    return;

  }


  const file=input.files[0];


  $("input").value=
    "[Attached file: "+file.name+"]";


  toast(
    "File attached: "+file.name
  );

}


/* ---------- IMAGES ---------- */

function chooseImage(){

  $("image").click();

}


function imageSelected(input){

  if(!input.files.length){

    return;

  }


  const file=input.files[0];


  $("input").value=
    "[Attached image: "+file.name+"]";


  toast(
    "Image attached: "+file.name
  );

}


/* ---------- SETTINGS ---------- */

function openSettings(){

  openDrawer(

    "Settings",

    `

    <div class="card">

      <label>Secure Backend URL</label>

      <input
        id="backendInput"
        value="${escapeHTML(Nova.backend)}"
        placeholder="https://your-worker.workers.dev"
      >

    </div>


    <div class="card">

      <label>AI Mode</label>

      <select id="modeInput">

        <option value="demo"
          ${Nova.mode==="demo"?"selected":""}>
          Demo
        </option>

        <option value="backend"
          ${Nova.mode==="backend"?"selected":""}>
          Secure Backend / Real AI
        </option>

      </select>

    </div>


    <div class="card">

      <label>Voice Replies</label>

      <select id="voiceInput">

        <option value="true"
          ${Nova.voice?"selected":""}>
          On
        </option>

        <option value="false"
          ${!Nova.voice?"selected":""}>
          Off
        </option>

      </select>

    </div>


    <button
      class="primary"
      onclick="saveSettings()">

      Save Settings

    </button>


    <p style="
      color:#929db6;
      font-size:12px;
      line-height:1.5;
      margin-top:15px">

      Never put an API key in index.html.
      Keep secrets inside your secure
      Cloudflare Worker/backend.

    </p>

    `

  );

}


function saveSettings(){

  Nova.backend=
    $("backendInput")
    .value
    .trim();


  Nova.mode=
    $("modeInput")
    .value;


  Nova.voice=
    $("voiceInput")
    .value==="true";


  save();

  closeDrawer();

  toast("Settings saved");

}


/* ---------- ADVANCED API CENTER ---------- */

function openTools(){

  openDrawer(

    "Tools & APIs",

    `

    <div class="card">

      <b>🤖 AI Chat</b>

      <p style="color:#929db6;font-size:13px;margin-top:6px">
      Secure backend connector ready.
      </p>

    </d
