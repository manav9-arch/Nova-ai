<title>Nova AI</title>  <style>    
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}    
html,body{margin:0;width:100%;height:100%;background:#070a12;color:#fff;font-family:Arial,sans-serif}    
body{overflow:hidden}    
button,textarea,input,select{font:inherit}    
button{cursor:pointer}    #app{height:100dvh;display:flex;background:#070a12}

#side{
width:220px;min-width:220px;background:#0d1322;
border-right:1px solid #1c2435;padding:12px;
display:flex;flex-direction:column;gap:8px
}

.brand{display:flex;align-items:center;gap:9px;padding:3px 4px 8px;font-weight:800;font-size:17px}

.logo{
width:32px;height:32px;border-radius:10px;
background:linear-gradient(135deg,#4e8cff,#8d35ff);
display:grid;place-items:center
}

.sidebtn{
border:1px solid #202a40;background:#111a2c;color:#dce3ef;
border-radius:9px;padding:9px;text-align:left
}

background:linear-gradient(135deg,#4b2cff,#7447ff);
border:0;color:#fff;text-align:center;font-weight:700
}

.section{
font-size:10px;color:#69758a;margin:8px 4px 2px;
text-transform:uppercase
}

#main{flex:1;min-width:0;display:flex;flex-direction:column}

#top{
height:56px;display:flex;align-items:center;justify-content:space-between;
padding:0 12px;border-bottom:1px solid #1b2333;background:#0b1020
}

.topbtn{
width:36px;height:36px;border:0;border-radius:9px;
background:#121a2b;color:#fff
}

.status{font-size:11px;color:#7b8799}
.status b{color:#31d27a}

#chat{
flex:1;overflow:auto;padding:22px 14px 16px
}

.welcome{
text-align:center;max-width:650px;margin:70px auto 0
}

.biglogo{
width:76px;height:76px;border-radius:22px;margin:auto;
background:linear-gradient(135deg,#9a65ff,#1c8cff);
display:grid;place-items:center;font-size:34px;font-weight:900
}

.welcome h1{font-size:30px;margin:18px 0 8px}
.welcome p{color:#8792a4;font-size:13px;line-height:1.5}

.quick{
display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin-top:15px
}

.quick button{
border:1px solid #202a3d;background:#10182a;color:#d9e0eb;
border-radius:18px;padding:7px 10px
}

.row{display:flex;margin:13px 0}
.row.user{justify-content:flex-end}
.wrap{max-width:min(82%,680px)}

.bubble{
padding:12px 14px;border-radius:16px;line-height:1.5;
font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere
}

.user .bubble{
background:#2867e8;border-bottom-right-radius:5px
}

.ai .bubble{
background:#171a20;border:1px solid #20242d;
border-bottom-left-radius:5px
}

.tools{display:flex;gap:5px;margin-top:4px}

.tool{
border:0;background:transparent;color:#7d8796;
padding:4px 7px;font-size:11px
}

.typing{
display:none;width:max-content;padding:10px 13px;
background:#171a20;border-radius:15px
}

.typing.show{display:flex;gap:4px}

.dot{
width:6px;height:6px;border-radius:50%;background:#a5afbd
}

#composer{
padding:9px 12px 11px;border-top:1px solid #1b2333;
background:#0b1020
}

.box{
border:1px solid #202a3b;background:#111827;
border-radius:17px;padding:7px;display:flex;
align-items:flex-end;gap:6px
}

#input{
flex:1;min-width:0;max-height:120px;resize:none;
border:0;outline:0;background:transparent;color:#fff;
padding:8px;line-height:1.4
}

.iconbtn{
width:38px;height:38px;border:0;border-radius:11px;
background:#182235;color:#fff
}

#send{background:linear-gradient(135deg,#4b2cff,#287cff)}

#fileInput{display:none}

.preview{
font-size:11px;color:#8f9bad;padding:4px 8px;display:none
}

@media(max-width:700px){
#side{display:none}
.wrap{max-width:88%}
.welcome{margin-top:45px}
.welcome h1{font-size:26px}
}
</style>  </head>  <body>  <div id="app">  <aside id="side">  <div class="brand">

<div class="logo">N</div>    
<span>Nova AI</span>    
</div>  <button class="sidebtn primary" id="newChat">＋ New Chat</button>  <button class="sidebtn" id="searchChats">🔎 Search Chats</button>

<div class="section">Tools</div>  <button class="sidebtn" id="testConnection">    
🔌 Test Connection    
</button>  <button class="sidebtn" id="googleSearch">    
🌐 Google Search    
</button>  <button class="sidebtn" id="showMemory">    
🧠 Memory    
</button>  <button class="sidebtn" id="settings">    
⚙️ Settings    
</button>  </aside>  <main id="main">  <header id="top">  <button class="topbtn" id="mobileMenu">☰</button>  <div>    
<b>Nova AI</b>    
<div class="status">● <b>Online</b></div>    
</div>  <button class="topbtn" id="clearChat">🗑</button>  </header>  <section id="chat">  <div class="welcome" id="welcome">  <div class="biglogo">N</div>  <h1>Nova AI</h1>  <p>    
Your AI assistant. Ask anything, use your voice,    
attach text files, or try a quick prompt.    
</p>  <div class="quick">  <button data-q="Explain artificial intelligence simply">    
Explain AI    
</button>  <button data-q="Write a short motivational message">    
Motivation    
</button>  <button data-q="Give me 5 useful study tips">    
Study tips    
</button>  </div>  </div>  <div class="typing" id="typing">    
<span class="dot"></span>    
<span class="dot"></span>    
<span class="dot"></span>    
</div>  </section>  <footer id="composer">  <div class="preview" id="preview"></div>  <div class="box">  <button class="iconbtn" id="attach">＋</button>  <textarea    
id="input"    
rows="1"    
placeholder="Message Nova AI..."    
></textarea>  <button class="iconbtn" id="mic">🎙️</button>  <button class="iconbtn" id="send">➤</button>

</div>  <input  
id="fileInput"  
type="file"  
accept=".txt,.md,.json,.csv,.js,.html,.css,.py,.java,.xml,.yaml,.yml,.log"  > 

</footer>  </main>    
</div>  <script>    /* =========================
NOVA AI BACKEND
========================= */

const API =
"https://red-mountain-f307.motiharijan123456.workers.dev/chat";

/* =========================
LOCAL DATA
========================= */

let messages =
JSON.parse(localStorage.getItem("nova_messages") || "[]");

let memory =
JSON.parse(localStorage.getItem("nova_memory") || "[]");

let pendingFile = null;

/* =========================
HELPERS
========================= */

const $ = id => document.getElementById(id);

const chat = $("chat");
const input = $("input");
const typing = $("typing");
const preview = $("preview");

function save(){

localStorage.setItem(
"nova_messages",
JSON.stringify(messages)
);

localStorage.setItem(
"nova_memory",
JSON.stringify(memory)
);

}

function escapeHTML(text){

return String(text).replace(
/[&<>"']/g,

function(c){

return {
"&":"&",
"<":"<",
">":">",
'"':""",
"'":"'"
}[c];

});

}

/* =========================
RENDER CHAT
========================= */

function render(){

chat.querySelectorAll(".row").forEach(
x => x.remove()
);

if(messages.length === 0){

$("welcome").style.display = "block";

return;

}

$("welcome").style.display = "none";

messages.forEach((m,index)=>{

const row = document.createElement("div");

row.className =
"row " +
(m.role === "user" ? "user" : "ai");

const wrap = document.createElement("div");

wrap.className = "wrap";

const bubble =
document.createElement("div");

bubble.className = "bubble";

bubble.innerHTML =
escapeHTML(m.content);

wrap.appendChild(bubble);

if(m.role === "assistant"){

const tools =
document.createElement("div");

tools.className = "tools";

tools.innerHTML =     <button class="tool copy">📋 Copy</button>     <button class="tool speak">🔊 Speak</button>     <button class="tool regen">↻ Regenerate</button>    ;

tools.querySelector(".copy").onclick =
async () => {

try{

await navigator.clipboard.writeText(
m.content
);

alert("Copied!");

}catch{

alert("Copy failed.");

}

};

tools.querySelector(".speak").onclick =
() => speak(m.content);

tools.querySelector(".regen").onclick =
() => regenerate(index);

wrap.appendChild(tools);

}

row.appendChild(wrap);

chat.insertBefore(row,typing);

});

chat.scrollTop = chat.scrollHeight;

}

/* =========================
VOICE OUTPUT
========================= */

function speak(text){

if(!("speechSynthesis" in window)){

alert("Voice output supported nahi hai.");

return;

}

speechSynthesis.cancel();

const utterance =
new SpeechSynthesisUtterance(text);

speechSynthesis.speak(utterance);

}

/* =========================
TEXTAREA SIZE
========================= */

function resize(){

input.style.height = "auto";

input.style.height =
Math.min(input.scrollHeight,120) + "px";

}

/* =========================
MEMORY
========================= */

function memoryText(){

if(!memory.length) return "";

return "\n\nSaved memory:\n" +
memory.join("\n");

}

/* =========================
SEND MESSAGE
========================= */

async function sendMessage(
text = input.value.trim()
){

if(!text && !pendingFile) return;

let final = text;

if(pendingFile){

final +=
(final ? "\n\n" : "") +
"Attached file:\n" +
pendingFile.text;

}

messages.push({
role:"user",
content:final
});

save();
render();

input.value = "";
resize();

pendingFile = null;

preview.style.display = "none";
preview.textContent = "";

typing.classList.add("show");

chat.scrollTop =
chat.scrollHeight;

try{

const history =
messages
.slice(-20)
.map(m => ({
role:m.role,
content:m.content
}));

const response =
await fetch(API,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

message:
final + memoryText(),

history:history

})

});

const data =
await response.json();

if(!response.ok || !data.ok){

throw new Error(
data.error || "Server error"
);

}

messages.push({

role:"assistant",

content:
data.reply || "No reply received."

});

save();
render();

if(
localStorage.getItem(
"nova_autospeak"
) === "1"
){

speak(data.reply);

}

}catch(error){

messages.push({

role:"assistant",

content:
"❌ Connection error: " +
error.message

});

save();
render();

}finally{

typing.classList.remove("show");

}

}

/* =========================
REGENERATE
========================= */

async function regenerate(index){

const previous =
messages[index - 1];

if(
!previous ||
previous.role !== "user"
){

return;

}

messages =
messages.slice(0,index);

save();
render();

await sendMessage(
previous.content
);

}

/* =========================
NEW CHAT
========================= */

$("newChat").onclick = () => {

messages = [];

save();
render();

input.focus();

};

/* =========================
CLEAR CHAT
========================= */

$("clearChat").onclick = () => {

if(
confirm(
"Current chat clear karna hai?"
)
){

messages = [];

save();
render();

}

};

/* =========================
SEND BUTTON
========================= */

$("send").onclick = () => {

sendMessage();

};

/* =========================
ENTER SEND
========================= */

input.addEventListener(
"keydown",
function(e){

if(
e.key === "Enter" &&
!e.shiftKey
){

e.preventDefault();

sendMessage();

}

});

input.addEventListener(
"input",
resize
);

/* =========================
FILE ATTACH
========================= */

$("attach").onclick = () => {

$("fileInput").click();

};

$("fileInput").onchange =
async function(e){

const file =
e.target.files[0];

if(!file) return;

if(file.size > 200000){

alert(
"File 200 KB se chhoti rakho."
);

return;

}

try{

const text =
await file.text();

pendingFile = {

name:file.name,

text:text

};

preview.textContent =
"📎 " +
file.name +
" attached";

preview.style.display =
"block";

}catch(error){

alert(
"File read nahi ho payi."
);

}

};

/* =========================
GOOGLE SEARCH
========================= */

$("googleSearch").onclick = () => {

const q =
prompt(
"Kya search karna hai?"
);

if(q){

window.open(
"https://www.google.com/search?q=" +
encodeURIComponent(q),
"_blank"
);

}

};

/* =========================
CONNECTION TEST
========================= */

$("testConnection").onclick =
async function(){

const button =
$("testConnection");

button.textContent =
"⏳ Testing...";

try{

const response =
await fetch(API,{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

message:
"Hello Nova, connection test",

history:[]

})

});

const data =
await response.json();

if(data.ok){

alert(
"✅ Nova Connected!\n\n" +
data.reply
);

}else{

alert(
"❌ Nova Error\n\n" +
JSON.stringify(data)
);

}

}catch(error){

alert(
"❌ Connection failed\n\n" +
error.message
);

}

button.textContent =
"🔌 Test Connection";

};

/* =========================
MEMORY
========================= */

$("showMemory").onclick = () => {

const action =
prompt(
"Memory:\n" +
"1 = Add\n" +
"2 = View\n" +
"3 = Clear"
);

if(action === "1"){

const text =
prompt(
"Kya remember karna hai?"
);

if(text){

memory.push(text);

save();

alert(
"✅ Memory saved"
);

}

}

else if(action === "2"){

alert(

memory.length

?

memory
.map(
(x,i)=>
(i+1) + ". " + x
)
.join("\n")

:

"No saved memory."

);

}

else if(action === "3"){

memory = [];

save();

alert(
"✅ Memory cleared"
);

}

};

/* =========================
SETTINGS
========================= */

$("settings").onclick = () => {

const auto =
localStorage.getItem(
"nova_autospeak"
) === "1";

const action =
prompt(

"Settings:\n" +

"1 = Auto speak " +
(auto ? "(ON)" : "(OFF)") +

"\n2 = Reset app data"

);

if(action === "1"){

localStorage.setItem(
"nova_autospeak",
auto ? "0" : "1"
);

alert(
"Auto speak " +
(!auto ? "ON" : "OFF")
);

}

if(
action === "2" &&
confirm(
"Reset all Nova data?"
)
){

localStorage.clear();

location.reload();

}

};

/* =========================
SEARCH CHATS
========================= */

$("searchChats").onclick = () => {

const q =
prompt(
"Chat me kya search karna hai?"
);

if(!q) return;

const found =
messages.filter(
m =>
m.content
.toLowerCase()
.includes(
q.toLowerCase()
)
);

if(found.length){

alert(

found
.map(
m =>
m.role +
": " +
m.content.slice(0,120)
)
.join("\n\n")

);

}else{

alert(
"Kuch nahi mila."
);

}

};

/* =========================
QUICK PROMPTS
========================= */

document
.querySelectorAll(".quick button")
.forEach(button => {

button.onclick = () => {

input.value =
button.dataset.q;

resize();

sendMessage();

};

});

/* =========================
VOICE INPUT
========================= */

$("mic").onclick = () => {

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;

if(!SpeechRecognition){

alert(
"Is browser me voice input supported nahi hai."
);

return;

}

const recognition =
new SpeechRecognition();

recognition.lang =
"en-IN";

recognition.interimResults =
false;

recognition.continuous =
false;

recognition.onresult =
function(event){

const text =
event
.results[0][0]
.transcript;

input.value +=
(input.value ? " " : "") +
text;

resize();

};

recognition.onerror =
function(event){

alert(
"Voice error: " +
event.error
);

};

try{

recognition.start();

}catch(error){

alert(
"Microphone start nahi ho paya."
);

}

};

/* =========================
MOBILE MENU
========================= */

$("mobileMenu").onclick = () => {

alert(
"Nova AI\n\n" +
"Mobile version me chat controls neeche hain."
);

};

/* =========================
START
========================= */

render();

resize();

</script>  </body>

   </html>
