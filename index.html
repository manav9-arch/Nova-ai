<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>Nova AI</title>

<style>
*{box-sizing:border-box}
:root{
  --bg:#070b18;
  --panel:#0d1328;
  --panel2:#111936;
  --border:#20294b;
  --text:#f7f8ff;
  --muted:#9ba5c5;
  --accent:#7c3cff;
  --accent2:#a855f7;
  --user:#33206d;
  --danger:#ef4444;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  height:100vh;
  overflow:hidden;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.app{
  height:100vh;
  display:flex;
}

/* SIDEBAR */
.sidebar{
  width:270px;
  background:#090e20;
  border-right:1px solid var(--border);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:12px;
  transition:.25s;
}
.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:19px;
  padding:4px;
}
.logoIcon{
  width:36px;height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#38bdf8,#7c3cff);
  font-weight:900;
}
.newChat{
  border:0;
  border-radius:10px;
  padding:12px;
  background:linear-gradient(135deg,#7437ff,#9348ff);
  color:white;
  font-weight:700;
}
.nav{
  display:grid;
  gap:6px;
}
.nav button{
  text-align:left;
  color:#d9def3;
  background:#10172d;
  border:1px solid #18203d;
  border-radius:9px;
  padding:10px;
}
.nav button:hover{background:#171f3d}
.recentTitle{
  color:#697393;
  font-size:10px;
  letter-spacing:.08em;
  margin-top:4px;
}
.recent{
  overflow:auto;
  flex:1;
}
.recent button{
  display:block;
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  color:#aab2cc;
  padding:8px;
  border-radius:7px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.recent button:hover{background:#111936}

/* MAIN */
.main{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
}
.topbar{
  height:64px;
  border-bottom:1px solid var(--border);
  background:#0a1022;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
}
.menuBtn,.iconBtn{
  background:#111936;
  color:white;
  border:1px solid var(--border);
  border-radius:10px;
  padding:8px 11px;
}
.status{
  font-size:11px;
  color:#79e5a2;
}
.status span{
  display:inline-block;
  width:7px;height:7px;
  border-radius:50%;
  background:#22c55e;
  margin-right:5px;
}
.chat{
  flex:1;
  overflow:auto;
  padding:28px 15px 160px;
}
.welcome{
  min-height:60vh;
  display:grid;
  place-items:center;
  text-align:center;
}
.welcomeBox{max-width:650px}
.novaBig{
  width:76px;height:76px;
  margin:auto;
  border-radius:24px;
  display:grid;
  place-items:center;
  font-size:38px;
  font-weight:900;
  background:linear-gradient(135deg,#8b5cf6,#2563eb);
  box-shadow:0 10px 45px #5b21b655;
}
.welcome h1{
  font-size:38px;
  margin:18px 0 8px;
}
.welcome p{
  color:var(--muted);
  line-height:1.6;
}
.quick{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  justify-content:center;
  margin-top:18px;
}
.quick button{
  background:#10172d;
  color:#dce1f5;
  border:1px solid var(--border);
  border-radius:20px;
  padding:8px 12px;
}

.message{
  max-width:850px;
  margin:0 auto 18px;
  display:flex;
  gap:10px;
}
.avatar{
  width:34px;height:34px;
  flex:0 0 34px;
  border-radius:10px;
  display:grid;
  place-items:center;
  background:#18203e;
  font-size:14px;
  font-weight:800;
}
.message.user .avatar{
  background:#42208a;
}
.bubble{
  max-width:calc(100% - 45px);
  border:1px solid var(--border);
  background:#0e152d;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.6;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.message.user .bubble{
  background:var(--user);
}
.attachments{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:8px;
}
.attachment{
  border:1px solid var(--border);
  background:#0b1125;
  border-radius:8px;
  padding:7px;
  font-size:12px;
  color:#c8cee2;
}
.attachment img{
  max-width:180px;
  max-height:130px;
  border-radius:7px;
  display:block;
}

/* COMPOSER */
.composerWrap{
  position:absolute;
  left:270px;
  right:0;
  bottom:0;
  padding:12px 15px 18px;
  background:linear-gradient(transparent,var(--bg) 25%);
}
.composer{
  max-width:850px;
  margin:auto;
  background:#0d142b;
  border:1px solid var(--border);
  border-radius:16px;
  padding:9px;
  box-shadow:0 -5px 30px #0005;
}
textarea{
  width:100%;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  min-height:42px;
  max-height:150px;
  padding:7px;
}
.composerBottom{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:6px;
}
.tools{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}
.tools button{
  background:transparent;
  border:0;
  color:#9da7c4;
  padding:6px;
  border-radius:7px;
}
.tools button:hover{background:#161e39;color:white}
.send{
  width:40px;height:40px;
  border:0;
  border-radius:11px;
  color:white;
  background:linear-gradient(135deg,#7437ff,#a855f7);
  font-size:18px;
}
.send:disabled{opacity:.5}

/* PANELS */
.overlay{
  position:fixed;
  inset:0;
  background:#0009;
  display:none;
  z-index:20;
}
.overlay.show{display:block}
.panel{
  position:absolute;
  right:0;
  top:0;
  height:100%;
  width:min(430px,92vw);
  background:#0b1125;
  border-left:1px solid var(--border);
  padding:20px;
  overflow:auto;
}
.panel h2{margin-top:0}
.close{
  float:right;
  background:#151d37;
  border:0;
  color:white;
  border-radius:8px;
  padding:7px 10px;
}
.card{
  border:1px solid var(--border);
  background:#0f1630;
  padding:13px;
  border-radius:12px;
  margin:10px 0;
}
.card label{
  display:block;
  color:#9ba5c5;
  font-size:12px;
  margin-bottom:5px;
}
.card input,.card select{
  width:100%;
  background:#080d1d;
  color:white;
  border:1px solid var(--border);
  padding:9px;
  border-radius:8px;
}
.panelBtn{
  border:1px solid var(--border);
  background:#151d37;
  color:white;
  padding:9px 12px;
  border-radius:8px;
  margin:3px 0;
}

/* TYPING */
.typing{
  display:inline-flex;
  gap:4px;
}
.typing i{
  width:6px;height:6px;
  border-radius:50%;
  background:#9ba5c5;
  animation:b 1s infinite;
}
.typing i:nth-child(2){animation-delay:.15s}
.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}

/* MOBILE */
@media(max-width:750px){
  .sidebar{
    position:fixed;
    left:-280px;
    top:0;
    bottom:0;
    z-index:30;
  }
  .sidebar.open{left:0}
  .composerWrap{left:0}
  .welcome h1{font-size:31px}
  .chat{padding-top:20px}
}

/* LIGHT */
body.light{
  --bg:#f5f7fb;
  --panel:#fff;
  --panel2:#f1f3f8;
  --border:#dfe3ed;
  --text:#151927;
  --muted:#68718a;
  --user:#e5d8ff;
}
body.light .sidebar,
body.light .topbar,
body.light .composer{
  background:#fff;
}
body.light .bubble{
  background:#fff;
  color:#151927;
}
body.light .message.user .bubble{background:#e9ddff}
body.light textarea{color:#151927}
body.light .card,
body.light .panel{background:#fff}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar" id="sidebar">
  <div class="logo">
    <div class="logoIcon">N</div>
    <span>Nova AI</span>
  </div>

  <button class="newChat" onclick="newChat()">＋ New Chat</button>

  <div class="nav">
    <button onclick="closePanels()">💬 Chat</button>
    <button onclick="openPanel('tools')">🧰 Tools & APIs</button>
    <button onclick="openPanel('settings')">⚙️ Settings</button>
    <button onclick="openPanel('memory')">🧠 Memory</button>
    <button onclick="openPanel('files')">📁 Files</button>
    <button onclick="openPanel('automation')">⏰ Automation</button>
  </div>

  <div class="recentTitle">RECENT CHATS</div>
  <div class="recent" id="recent"></div>
</aside>

<main class="main">

<header class="topbar">
  <button class="menuBtn" onclick="toggleSidebar()">☰</button>
  <div class="status"><span></span>Nova Ready</div>
  <button class="iconBtn" onclick="openPanel('settings')">⚙</button>
</header>

<section class="chat" id="chat"></section>

<div class="composerWrap">
  <div class="composer">

    <textarea
      id="input"
      placeholder="Message Nova..."
      rows="1"
      onkeydown="handleKey(event)"
    ></textarea>

    <div class="composerBottom">
      <div class="tools">
        <button onclick="fileInput.click()">📎 File</button>
        <button onclick="imageInput.click()">🖼️ Image</button>
        <button onclick="startVoice()">🎙️ Voice</button>
        <button onclick="speakLast()">🔊 Speak</button>
        <button onclick="webSearchHook()">🌐 Web</button>
      </div>

      <button class="send" id="send" onclick="sendMessage()">➤</button>
    </div>

  </div>
</div>

</main>
</div>

<input id="fileInput" type="file" hidden multiple>
<input id="imageInput" type="file" hidden multiple accept="image/*">

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
/* =========================================================
   NOVA AI CORE
   Cloudflare Worker backend
   ========================================================= */

const NOVA_BACKEND =
  "https://red-mountain-f307.motiharijan123456.workers.dev/chat";

const STORAGE_KEY = "nova_ai_chats_v3";
const SETTINGS_KEY = "nova_ai_settings_v3";
const MEMORY_KEY = "nova_ai_memory_v3";

let chats = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
let currentChat = null;
let attachedFiles = [];
let lastAssistantReply = "";
let isSending = false;

let settings = JSON.parse(
  localStorage.getItem(SETTINGS_KEY) || "{}"
);

let memory = JSON.parse(
  localStorage.getItem(MEMORY_KEY) || "[]"
);

/* =========================================================
   INIT
   ========================================================= */

function init(){

  if(settings.theme === "light"){
    document.body.classList.add("light");
  }

  if(!chats.length){
    createChat();
  }else{
    currentChat = chats[0];
  }

  renderRecent();
  renderChat();
}

function createChat(){
  currentChat = {
    id: Date.now().toString(),
    title: "New Chat",
    messages: [],
    createdAt: Date.now()
  };

  chats.unshift(currentChat);
  saveChats();
  renderRecent();
  renderChat();
}

function newChat(){
  createChat();

  if(window.innerWidth < 750){
    document.getElementById("sidebar").classList.remove("open");
  }
}

function saveChats(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
}

function saveSettings(){
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
}

function saveMemory(){
  localStorage.setItem(MEMORY_KEY, JSON.stringify(memory));
}

/* =========================================================
   CHAT RENDER
   ========================================================= */

function renderRecent(){

  const box = document.getElementById("recent");
  box.innerHTML = "";

  chats.slice(0,30).forEach(c => {

    const b = document.createElement("button");

    b.textContent = c.title || "New Chat";

    b.onclick = () => {
      currentChat = c;
      renderChat();

      if(window.innerWidth < 750){
        document.getElementById("sidebar").classList.remove("open");
      }
    };

    box.appendChild(b);
  });
}

function renderChat(){

  const chat = document.getElementById("chat");

  chat.innerHTML = "";

  if(!currentChat || !currentChat.messages.length){

    chat.innerHTML = `
      <div class="welcome">
        <div class="welcomeBox">

          <div class="novaBig">N</div>

          <h1>Hello, I'm Nova.</h1>

          <p>
            Your personal AI assistant — chat, voice, memory,
            files, images, tools, automation and future AI features.
          </p>

          <div class="quick">
            <button onclick="quick('What can you do?')">
              ✨ What can you do?
            </button>

            <button onclick="quick('Plan my day')">
              📅 Plan my day
            </button>

            <button onclick="quick('Explain artificial intelligence simply')">
              💡 Explain
            </button>
          </div>

        </div>
      </div>
    `;

    return;
  }

  currentChat.messages.forEach(m => {

    const row = document.createElement("div");
    row.className = "message " + m.role;

    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = m.role === "user" ? "You" : "N";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = m.content;

    row.appendChild(avatar);
    row.appendChild(bubble);

    chat.appendChild(row);
  });

  setTimeout(() => {
    chat.scrollTop = chat.scrollHeight;
  },20);
}

function quick(text){
  document.getElementById("input").value = text;
  sendMessage();
}

/* =========================================================
   REAL AI CONNECTION
   ========================================================= */

async function sendMessage(){

  if(isSending) return;

  const input = document.getElementById("input");
  const text = input.value.trim();

  if(!text && !attachedFiles.length) return;

  isSending = true;
  document.getElementById("send").disabled = true;

  let messageText = text;

  if(attachedFiles.length){

    messageText += "\n\nAttached files:\n" +
      attachedFiles.map(f => "- " + f.name).join("\n");
  }

  if(!currentChat){
    createChat();
  }

  currentChat.messages.push({
    role:"user",
    content:messageText
  });

  if(currentChat.messages.length === 1){

    currentChat.title =
      text.slice(0,35) ||
      attachedFiles[0]?.name ||
      "New Chat";
  }

  saveChats();
  renderRecent();
  renderChat();

  input.value = "";
  autoResize(input);

  showTyping();

  try{

    /*
      IMPORTANT:
      The API key is NOT here.
      It stays safely inside Cloudflare Worker.
    */

    const history =
      currentChat.messages
      .slice(0,-1)
      .slice(-20)
      .map(m => ({
        role:m.role,
        content:m.content
      }));

    const response = await fetch(NOVA_BACKEND,{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:messageText,
        history:history
      })
    });

    const data = await response.json();

    removeTyping();

    if(!response.ok || !data.ok){

      throw new Error(
        data.error || "Nova backend request failed."
      );
    }

    const reply =
      data.reply ||
      "I couldn't generate a response.";

    lastAssistantReply = reply;

    currentChat.messages.push({
      role:"assistant",
      content:reply
    });

    /*
      Simple memory detection.
      User can also manually manage memory.
    */

    detectMemory(text);

    saveChats();
    renderRecent();
    renderChat();

    if(settings.autoSpeak){
      speak(reply);
    }

  }catch(error){

    removeTyping();

    const errorText =
      "Nova connection error: " +
      (error.message || "Unknown error");

    currentChat.messages.push({
      role:"assistant",
      content:errorText
    });

    saveChats();
    renderChat();

  }finally{

    attachedFiles = [];
    isSending = false;
    document.getElementById("send").disabled = false;
  }
}

/* =========================================================
   TYPING
   ========================================================= */

function showTyping(){

  const chat = document.getElementById("chat");

  const row = document.createElement("div");
  row.className = "message";
  row.id = "typingRow";

  row.innerHTML = `
    <div class="avatar">N</div>
    <div class="bubble">
      <span class="typing">
        <i></i><i></i><i></i>
      </span>
    </div>
  `;

  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
}

function removeTyping(){

  const row = document.getElementById("typingRow");

  if(row) row.remove();
}

/* =========================================================
   MEMORY
   ========================================================= */

function detectMemory(text){

  const patterns = [
    /remember that (.+)/i,
    /remember this (.+)/i,
    /my name is (.+)/i,
    /i like (.+)/i
  ];

  for(const p of patterns){

    const match = text.match(p);

    if(match){

      memory.push({
        text:match[1].trim(),
        date:new Date().toISOString()
      });

      memory = memory.slice(-100);

      saveMemory();

      break;
    }
  }
}

/* =========================================================
   VOICE INPUT
   ========================================================= */

let recognition = null;

function startVoice(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Voice input is not supported by this browser."
    );

    return;
  }

  if(recognition){

    recognition.stop();
    recognition = null;
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang =
    settings.voiceLanguage || "en-IN";

  recognition.interimResults = true;
  recognition.continuous = false;

  recognition.onresult = event => {

    let text = "";

    for(
      let i=event.resultIndex;
      i<event.results.length;
      i++
    ){

      text += event.results[i][0].transcript;
    }

    document.getElementById("input").value = text;
    autoResize(document.getElementById("input"));
  };

  recognition.onerror = () => {
    recognition = null;
  };

  recognition.onend = () => {
    recognition = null;
  };

  recognition.start();
}

/* =========================================================
   VOICE OUTPUT
   ========================================================= */

function speak(text){

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);

  u.lang =
    settings.voiceLanguage || "en-IN";

  u.rate =
    Number(settings.speechRate || 1);

  speechSynthesis.speak(u);
}

function speakLast(){

  if(!lastAssistantReply){

    alert("Nova has not replied yet.");

    return;
  }

  speak(lastAssistantReply);
}

/* =========================================================
   FILES / IMAGES
   ========================================================= */

document.getElementById("fileInput")
.addEventListener("change", e => {

  const files = [...e.target.files];

  attachedFiles.push(...files);

  showFileInfo(files);

  e.target.value = "";
});

document.getElementById("imageInput")
.addEventListener("change", e => {

  const files = [...e.target.files];

  attachedFiles.push(...files);

  showFileInfo(files);

  e.target.value = "";
});

function showFileInfo(files){

  const names =
    files.map(f => f.name).join("\n");

  if(names){

    const input = document.getElementById("input");

    input.value =
      input.value +
      (input.value ? "\n" : "") +
      "Files selected: " +
      names;

    autoResize(input);
  }
}

/* =========================================================
   WEB SEARCH HOOK
   ========================================================= */

function webSearchHook(){

  /*
    Future secure backend endpoint:
    /search

    Do NOT put a search API key in this file.
  */

  const input = document.getElementById("input");

  input.value =
    input.value +
    (input.value ? " " : "") +
    "Search the web for: ";

  input.focus();

  autoResize(input);
}

/* =========================================================
   PANELS
   ========================================================= */

function openPanel(type){

  const overlay =
    document.getElementById("overlay");

  const panel =
    document.getElementById("panel");

  overlay.classList.add("show");

  if(type === "settings"){
    panel.innerHTML = settingsPanel();
  }

  if(type === "memory"){
    panel.innerHTML = memoryPanel();
  }

  i
